name: CICD

on:
  workflow_dispatch:
  jobs:
    code:
     steps:
      - name : Pulling the code
        run: echo "code is pulling"
     Build:
        need: code
        steps:
          - name: Building the code
            run: echo "Code Build is happening"
     Test:
       need: build
       steps:
         - name: Testing the code
           run: echo "Testing the code"
    Deploy:
       need: [build,test
       steps:
          - name: Deploy the code 
            run: echo "Deploying the code"
             
    
     
    
   
      
